<div class="modal-backdrop animate-fade-in" (click)="close()">
  <div class="modal-card glass-panel" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="modal-header">
      <div class="header-icon-wrap">
        <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
      </div>
      <div>
        <h2 class="modal-title">Send Friendly Reminder</h2>
        <p class="modal-subtitle">Polite, non-awkward message for {{ obligation.personName }}</p>
      </div>
      <button class="close-btn" (click)="close()" title="Close">
        <ion-icon name="close-outline"></ion-icon>
      </button>
    </div>

    <!-- Tone Selector -->
    <div class="tone-selector">
      <button
        class="tone-btn"
        [class.active]="selectedTone() === 'FRIENDLY'"
        (click)="setTone('FRIENDLY')"
      >
        🌟 Friendly
      </button>
      <button
        class="tone-btn"
        [class.active]="selectedTone() === 'SHORT'"
        (click)="setTone('SHORT')"
      >
        ⚡ Short
      </button>
      <button
        class="tone-btn"
        [class.active]="selectedTone() === 'POLITE'"
        (click)="setTone('POLITE')"
      >
        🙏 Polite
      </button>
    </div>

    <!-- Message Preview & Edit -->
    <div class="message-box">
      <textarea
        class="form-input message-textarea"
        rows="4"
        [ngModel]="messageText()"
        (ngModelChange)="messageText.set($event)"
      ></textarea>
      @if (activePerson()?.phoneNumber) {
        <div class="target-phone-pill">
          <ion-icon name="call-outline"></ion-icon>
          <span>Direct to: <strong>{{ activePerson()!.phoneNumber }}</strong></span>
        </div>
      }
    </div>

    <!-- Send Actions -->
    <div class="actions-grid" [class.has-phone]="!!activePerson()?.phoneNumber">
      <button class="btn-whatsapp action-btn" (click)="openWhatsApp()" title="Open WhatsApp chat directly">
        <ion-icon name="logo-whatsapp"></ion-icon>
        <span>WhatsApp</span>
      </button>

      @if (activePerson()?.phoneNumber) {
        <button class="btn-call action-btn" (click)="callPerson()" title="Call {{ activePerson()!.name }}">
          <ion-icon name="call-outline"></ion-icon>
          <span>Call</span>
        </button>
      }

      <button class="btn-sms action-btn" (click)="openSms()" title="Open SMS directly">
        <ion-icon name="send-outline"></ion-icon>
        <span>SMS</span>
      </button>

      <button class="btn-copy action-btn" (click)="copyText()" title="Copy text to clipboard">
        <ion-icon [name]="copied() ? 'checkmark-outline' : 'copy-outline'"></ion-icon>
        <span>{{ copied() ? 'Copied!' : 'Copy' }}</span>
      </button>
    </div>
  </div>
</div>
