name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test -- --watch=false

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: loop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare APK for Direct Download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk LOOP-v1.0.2.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk LOOP.apk

      - name: Publish Direct Public Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: LOOP v1.0.2 (Android - Consistent Signing & Safe Area)
          body: |
            ### LOOP v1.0.2 — Offline Personal Ledger
            - Consistent release key signing (seamless in-place updates)
            - Fixed Android status bar collision with edge-to-edge safe area insets
            - Dynamic theme matching for system status bar
            
            **Direct Download:**
            - **[Download LOOP-v1.0.2.apk](https://github.com/RamVinay3/offlineLedger/releases/download/v1.0.2/LOOP-v1.0.2.apk)**
          files: |
            LOOP-v1.0.2.apk
            LOOP.apk
